# DRAFT: needs one check - see TODO(ndk). Drop into .github/workflows/ of your fork.
name: android-apk
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.1.10909125"   # TODO(ndk): match whatever Make.android-arm64 expects
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK pieces
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;30.0.3" "ndk;${NDK_VERSION}"

      - name: Build APK (arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          make -f Make.android SDKPREFIX="$ANDROID_SDK_ROOT" JAVA_HOME="$JAVA_HOME"

      - name: Show APK facts
        run: |
          "$ANDROID_SDK_ROOT/build-tools/30.0.3/aapt" dump badging drawterm.apk | grep -E "package:|sdkVersion|targetSdk|native-code"
          unzip -v drawterm.apk resources.arsc lib/arm64-v8a/libdrawterm.so

      - uses: actions/upload-artifact@v4
        with:
          name: drawterm-apk
          path: drawterm.apk
